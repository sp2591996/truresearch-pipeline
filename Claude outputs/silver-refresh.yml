name: Silver Refresh

# Keeps the Other Assets -> Metals -> Silver page's price current, same
# cadence as gold-refresh.yml -- SILVERBEES.NS is a single, cheap row,
# no need for a tighter schedule.
#
# Session 30: added the same extra 3:45 PM IST run gold-refresh.yml /
# daily-prices.yml got, to better catch NSE's official closing price.

on:
  schedule:
    - cron: '45 3 * * 1-5'
    - cron: '*/15 4-9 * * 1-5'
    - cron: '0 10 * * 1-5'
    - cron: '15 10 * * 1-5'
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python 53_refresh_silver.py --force
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
