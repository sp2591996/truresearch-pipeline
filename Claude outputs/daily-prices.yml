name: Daily Price Refresh

# Session 30: added a 4th run at 3:45 PM IST (15 10 UTC), 15 minutes
# after market close (3:30 PM IST). NSE runs a short closing auction
# right after continuous trading ends that sets the official closing
# price -- free data sources like the one this project uses can lag
# that final settled price by a few minutes, so this extra run gives
# the pipeline one more chance to pick up the real closing print
# instead of whatever mid-auction price it caught at exactly 3:30.

on:
  schedule:
    - cron: '45 3 * * 1-5'
    - cron: '*/15 4-9 * * 1-5'
    - cron: '0 10 * * 1-5'
    - cron: '15 10 * * 1-5'
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python 05_daily_price_refresh.py --force
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
