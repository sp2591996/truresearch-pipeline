name: Gold Refresh

# Keeps the Other Assets -> Metals -> Gold page's price current, same
# cadence as daily-prices.yml (every 15 min across NSE market hours --
# GOLDBEES.NS is a single, cheap row, so this doesn't need its own
# tighter schedule the way the 5-min benchmark-indices job does).
#
# Session 30: added the same extra 3:45 PM IST run daily-prices.yml
# got, to better catch NSE's official closing price (set a few minutes
# after 3:30 PM by the closing auction) instead of just whatever the
# free data source had at exactly 3:30.

# Session 33 (scheduling fix, round 2): every Other Assets refresh job
# had NEVER fired on its schedule, ever -- confirmed via each
# workflow's Actions run history showing 0 scheduled runs, and even
# daily-prices.yml (which used to fire reliably) had stopped firing
# since Sept 11. GitHub's own docs explain why: scheduled workflows
# get delayed hardest -- and can be dropped outright -- right at
# minute :00 of each hour, because that's the most popular minute
# mark across EVERY repo on GitHub, not just this one. All these jobs
# were sitting on '45 3', '*/15 4-9' (i.e. :00/:15/:30/:45), '0 10',
# '15 10' -- exactly the most congested marks possible.
#
# Fixed properly this time: every job below now runs on minutes that
# are NOT multiples of 5, and no two jobs in this repo share an exact
# minute (benchmark-indices.yml fires every 5 minutes on its own
# minute-mod-5 lane; this job and the other 4 each use their own
# distinct minutes within a different lane). See each file's own
# comment for its exact assigned minutes.

on:
  schedule:
    - cron: '7 3 * * 1-5'
    - cron: '7,22,37,52 4-9 * * 1-5'
    - cron: '7 10 * * 1-5'
    - cron: '22 10 * * 1-5'
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python 48_refresh_gold.py --force
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
