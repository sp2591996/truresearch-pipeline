name: Gold Refresh

# Keeps the Other Assets -> Metals -> Gold page's price current, same
# cadence as daily-prices.yml (every 15 min across NSE market hours --
# GOLDBEES.NS is a single, cheap row, so this doesn't need its own
# tighter schedule the way the 5-min benchmark-indices job does).
#
# Session 30: added the same extra 3:45 PM IST run daily-prices.yml
# got, to better catch NSE's official closing price (set a few minutes
# after 3:30 PM by the closing auction) instead of just whatever the
# free data source had at exactly 3:30.

# Session 33 (scheduling fix): this job (and every other Other Assets
# refresh job) had NEVER fired on its schedule, ever -- confirmed via
# each workflow's Actions run history showing 0 scheduled runs.
# GitHub Actions silently drops scheduled triggers when too many
# workflows in the same repo are all set to fire at the exact same
# minute mark, which is what was happening here: this job shared the
# identical '45 3', '*/15 4-9', '0 10', '15 10' schedule with
# daily-prices.yml, silver-refresh.yml, fx-refresh.yml, and
# crude-refresh.yml. Fixed by staggering this job 2 minutes later than
# daily-prices.yml (which has historical evidence of actually firing),
# so it no longer competes for the same instant.

on:
  schedule:
    - cron: '47 3 * * 1-5'
    - cron: '2,17,32,47 4-9 * * 1-5'
    - cron: '2 10 * * 1-5'
    - cron: '17 10 * * 1-5'
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python 48_refresh_gold.py --force
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
