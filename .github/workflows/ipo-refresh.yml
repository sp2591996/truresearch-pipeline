name: IPO Tracker Refresh - India

# Session 34: was manual-only until now (Avdhoot: "have it run once a
# week"). Runs 34_refresh_ipos.py. GitHub's own cron trigger below is
# kept as a backup only -- cron-job.org is this project's primary
# scheduler.

on:
  schedule:
    - cron: '10 5 * * 0'
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python 34_refresh_ipos.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
