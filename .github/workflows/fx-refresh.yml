name: FX Refresh

# Keeps Other Assets -> FX rates current, same cadence as gold-refresh.yml
# / silver-refresh.yml -- 4 cheap rows, no need for a tighter schedule.
#
# Session 30: added the same extra 3:45 PM IST run the other NSE-hours
# refresh jobs got, to better catch NSE's official closing rate.

# Session 33 (scheduling fix): this job had NEVER fired on its
# schedule, ever -- GitHub Actions silently drops scheduled triggers
# when too many workflows in the same repo share the exact same
# minute mark (this one shared '45 3', '*/15 4-9', '0 10', '15 10'
# with daily-prices.yml, gold-refresh.yml, silver-refresh.yml, and
# crude-refresh.yml). Fixed by staggering this job 6 minutes later
# than daily-prices.yml.

on:
  schedule:
    - cron: '51 3 * * 1-5'
    - cron: '6,21,36,51 4-9 * * 1-5'
    - cron: '6 10 * * 1-5'
    - cron: '21 10 * * 1-5'
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python 56_refresh_fx.py --force
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
