name: FX Refresh

# Keeps Other Assets -> FX rates current, same cadence as gold-refresh.yml
# / silver-refresh.yml -- 4 cheap rows, no need for a tighter schedule.
#
# Session 30: added the same extra 3:45 PM IST run the other NSE-hours
# refresh jobs got, to better catch NSE's official closing rate.

# Session 33 (scheduling fix, round 2): this job had NEVER fired on
# its schedule, ever. GitHub's own docs explain why: scheduled runs
# get delayed hardest -- and can be dropped outright -- right at
# minute :00 of each hour, since that's the most popular minute mark
# across EVERY repo on GitHub, not just this one; this job used to sit
# on exactly those marks. Fixed properly this time: this job now runs
# on minute :08/:23/:38/:53 -- not a multiple of 5, and not shared
# with any other job in this repo (see each workflow's own comment
# for its assigned minutes; benchmark-indices.yml runs every 5 minutes
# on a completely different minute-mod-5 lane).

on:
  schedule:
    - cron: '8 3 * * 1-5'
    - cron: '8,23,38,53 4-9 * * 1-5'
    - cron: '8 10 * * 1-5'
    - cron: '23 10 * * 1-5'
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python 56_refresh_fx.py --force
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
