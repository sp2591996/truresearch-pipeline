name: Daily Price Refresh

# Session 30: added a 4th run at 3:45 PM IST (15 10 UTC), 15 minutes
# after market close (3:30 PM IST). NSE runs a short closing auction
# right after continuous trading ends that sets the official closing
# price -- free data sources like the one this project uses can lag
# that final settled price by a few minutes, so this extra run gives
# the pipeline one more chance to pick up the real closing print
# instead of whatever mid-auction price it caught at exactly 3:30.

# Session 33: India grew from ~500 to 2,568 stocks (Stage 2 universe
# expansion), so this job now runs as 3 parallel batches (matrix
# strategy below) instead of one job working through everyone in
# sequence -- keeps each run comfortably inside the 10-15 minute
# market-hours window instead of risking falling behind.

# Session 33 (scheduling fix, round 2): this job used to fire reliably,
# but stopped firing on schedule entirely after Sept 11 -- confirmed
# via Actions run history (only manual runs since then). GitHub's own
# docs explain why: scheduled runs get delayed hardest -- and can be
# dropped outright -- right at minute :00 of each hour, since that's
# the most popular minute mark across EVERY repo on GitHub, not just
# this one, and this job was sitting on exactly :00/:15/:30/:45.
# Fixed by moving this job to minute :02/:17/:32/:47 -- not a multiple
# of 5, and not shared with any other job in this repo (see each
# workflow's own comment for its assigned minutes).

on:
  schedule:
    - cron: '2 3 * * 1-5'
    - cron: '2,17,32,47 4-9 * * 1-5'
    - cron: '2 10 * * 1-5'
    - cron: '17 10 * * 1-5'
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        batch: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python 05_daily_price_refresh.py --force --batch-index=${{ matrix.batch }} --batch-count=3
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
