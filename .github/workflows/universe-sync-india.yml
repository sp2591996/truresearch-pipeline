name: Weekly Universe Sync - India

# Session 34: adds/deactivates India stocks automatically each week
# (see 104_weekly_universe_sync_india.py's own header). Runs a day
# before the existing weekly fundamentals/TrueScore/shareholding jobs
# so any newly added stock has time to be scored before the site
# would otherwise show it as incomplete. GitHub's own cron trigger
# below is kept as a backup only -- cron-job.org is this project's
# primary scheduler (see PROJECT_STATE.md for why).

on:
  schedule:
    - cron: '0 1 * * 6'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python 104_weekly_universe_sync_india.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      - run: python 87_assign_sectors_from_yfinance.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      - run: python 20_backfill_new_stocks_price_history.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
