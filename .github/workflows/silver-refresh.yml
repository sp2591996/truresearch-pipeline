name: Silver Refresh

# Keeps the Other Assets -> Metals -> Silver page's price current, same
# cadence as gold-refresh.yml -- SILVERBEES.NS is a single, cheap row,
# no need for a tighter schedule.
#
# Session 30: added the same extra 3:45 PM IST run gold-refresh.yml /
# daily-prices.yml got, to better catch NSE's official closing price.

# Session 33 (scheduling fix, round 2): this job had NEVER fired on
# its schedule, ever. GitHub's own docs explain why: scheduled runs
# get delayed hardest -- and can be dropped outright -- right at
# minute :00 of each hour, since that's the most popular minute mark
# across EVERY repo on GitHub, not just this one; this job used to sit
# on exactly those marks. Fixed properly this time: this job now runs
# on minute :03/:18/:33/:48 -- not a multiple of 5, and not shared
# with any other job in this repo (see each workflow's own comment
# for its assigned minutes; benchmark-indices.yml runs every 5 minutes
# on a completely different minute-mod-5 lane).

on:
  schedule:
    - cron: '3 3 * * 1-5'
    - cron: '3,18,33,48 4-9 * * 1-5'
    - cron: '3 10 * * 1-5'
    - cron: '18 10 * * 1-5'
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python 53_refresh_silver.py --force
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
