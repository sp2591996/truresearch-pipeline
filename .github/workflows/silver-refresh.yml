name: Silver Refresh

# Keeps the Other Assets -> Metals -> Silver page's price current, same
# cadence as gold-refresh.yml -- SILVERBEES.NS is a single, cheap row,
# no need for a tighter schedule.
#
# Session 30: added the same extra 3:45 PM IST run gold-refresh.yml /
# daily-prices.yml got, to better catch NSE's official closing price.

# Session 33 (scheduling fix): this job had NEVER fired on its
# schedule, ever -- GitHub Actions silently drops scheduled triggers
# when too many workflows in the same repo share the exact same
# minute mark (this one shared '45 3', '*/15 4-9', '0 10', '15 10'
# with daily-prices.yml, gold-refresh.yml, fx-refresh.yml, and
# crude-refresh.yml). Fixed by staggering this job 4 minutes later
# than daily-prices.yml.

on:
  schedule:
    - cron: '49 3 * * 1-5'
    - cron: '4,19,34,49 4-9 * * 1-5'
    - cron: '4 10 * * 1-5'
    - cron: '19 10 * * 1-5'
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python 53_refresh_silver.py --force
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
