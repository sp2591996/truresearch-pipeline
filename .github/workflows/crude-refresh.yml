name: Crude Oil Refresh

# Keeps Other Assets -> Commodities (WTI/Brent) current, same cadence
# budget as gold-refresh.yml / silver-refresh.yml / fx-refresh.yml --
# 2 cheap rows, no need for a tighter schedule. (59_refresh_crude_oil.py
# itself only gates on weekday, not NSE hours, since WTI/Brent trade
# on global exchanges well outside NSE's 9:15-15:30 IST window -- but
# this workflow still only *runs* during that window to keep GitHub
# Actions usage in line with every other Other Assets refresh job;
# --force just skips the script's own internal check, which would
# otherwise agree anyway on a weekday.)

# Session 33 (scheduling fix, round 2): this job had NEVER fired on
# its schedule, ever. GitHub's own docs explain why: scheduled runs
# get delayed hardest -- and can be dropped outright -- right at
# minute :00 of each hour, since that's the most popular minute mark
# across EVERY repo on GitHub, not just this one; this job used to sit
# on exactly those marks. Fixed properly this time: this job now runs
# on minute :04/:19/:34/:49 -- not a multiple of 5, and not shared
# with any other job in this repo (see each workflow's own comment
# for its assigned minutes; benchmark-indices.yml runs every 5 minutes
# on a completely different minute-mod-5 lane).

on:
  schedule:
    - cron: '4 3 * * 1-5'
    - cron: '4,19,34,49 4-9 * * 1-5'
    - cron: '4 10 * * 1-5'
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python 59_refresh_crude_oil.py --force
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
